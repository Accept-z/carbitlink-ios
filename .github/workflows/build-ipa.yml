name: build-unsigned-ipa

# 用途：这台机器是 Windows，没有 Xcode。推到 GitHub 后由 macOS runner 编译出
# 未签名 IPA，再用 Sideloadly 侧载（流程与 CarWithin 完全一致）。
#
# 一次性准备：
#   1. 本仓库 push 到你自己的 GitHub 私有仓库
#   2. 把 .local/Identity 下三个文件做成一个 secret：
#        macOS/Linux:  base64 -i certificate.p7b | tr -d '\n'   （三个文件分别做太麻烦，
#                      用下面的打包方式更省事）
#        推荐：在 tds-car-kit 根目录执行
#          tar czf identity.tgz -C .local Identity && base64 -i identity.tgz | tr -d '\n' | pbcopy
#        把结果存成仓库 secret：Settings → Secrets → Actions → 新建 IDENTITY_TGZ_B64
#   3. 没有 secret 也能编译（.local/Identity 为空时上游仍可构建，只是收不到 CarPlay）

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # macos-14 已被 GitHub 退役（报 "configuration 'macos-14-arm64-us-default' is not supported"），
    # macos-15 / macos-latest / macos-26 实测可用。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 校验源码版本
        run: |
          echo "HEAD = $(git rev-parse HEAD)"
          echo "CarbitLinkOutput.swift md5 = $(md5 -q App/CarbitLinkOutput.swift)"
          echo "CarbitLinkIdentity.swift md5 = $(md5 -q App/CarbitLinkIdentity.swift)"
          echo "[v1.1] 只收不发 carClientInfo=0x00010010: $(grep -c 'static let carClientInfo: UInt32 = 0x00010010' App/CarbitLinkWire.swift || true)"
          echo "[v1.1] 必须已删除 clientInfo 主动发常量(应为0): $(grep -c 'static let clientInfo: UInt32' App/CarbitLinkWire.swift || true)"
          echo "[v1.1] 控制口监听 = $(grep -c 'controlListenPort: UInt16 = 10922' App/CarbitLinkOutput.swift || true)"
          echo "[v1.1] 必须已删除拨出函数(应为0): $(grep -c 'func connectControl' App/CarbitLinkOutput.swift || true)"
          echo "[v1.1] 必须已删除主动上报(应为0): $(grep -c 'sendProactiveClientInfo' App/CarbitLinkOutput.swift || true)"
          echo "[v1.1] 监听控制口函数 = $(grep -c 'func startControlListener' App/CarbitLinkOutput.swift || true)"
          echo "[v1.1] 仪表能力解析 = $(grep -c 'static func parseCarCapability' App/CarbitLinkWire.swift || true)"
          echo "[v1.1] P2C 首帧 0x00020490 = $(grep -c 'startAudio: UInt32 = 0x00020490' App/CarbitLinkWire.swift || true)"
          echo "[v1.1] 通用 NAK 0x70000011 = $(grep -c 'unsupportedNack: UInt32 = 0x70000011' App/CarbitLinkWire.swift || true)"
          echo "[v1.1] ClientIdentity = $(grep -c 'struct ClientIdentity' App/CarbitLinkWire.swift || true)"
          echo "[v1.1] 原厂 phoneUUID = $(grep -c '45f68d78-cd77-4c1a-a8cd-080249272b48' App/CarbitLinkWire.swift || true)"
          echo "[v1.1] rsaSignatureRaw = $(grep -c 'rsaSignatureRaw' App/CarbitLinkIdentity.swift || true)"
          echo "allowLocalEndpointReuse = $(grep -c 'allowLocalEndpointReuse' App/CarbitLinkOutput.swift || true)"

      - name: v1.1 硬断言（方向错误必须构建失败）
        run: |
          set -e
          # 反向断言：这些符号必须为 0，否则说明 v1.0 的错误方向又回来了。
          fail=0
          check_zero() {
            n=$(grep -c "$1" "$2" || true)
            echo "  [$3] $2 : $1 => $n"
            if [ "$n" != "0" ]; then echo "::error::检测到应删除的 $3"; fail=1; fi
          }
          check_positive() {
            n=$(grep -c "$1" "$2" || true)
            echo "  [$3] $2 : $1 => $n"
            if [ "$n" = "0" ]; then echo "::error::缺少必需的 $3"; fail=1; fi
          }
          check_zero 'static let clientInfo: UInt32' App/CarbitLinkWire.swift "主动发CLIENT_INFO常量"
          check_zero 'func connectControl' App/CarbitLinkOutput.swift "拨出控制通道"
          check_zero 'sendProactiveClientInfo' App/CarbitLinkOutput.swift "主动上报"
          check_zero 'didSendProactiveInfo' App/CarbitLinkOutput.swift "主动上报状态位"
          check_positive 'static let carClientInfo: UInt32 = 0x00010010' App/CarbitLinkWire.swift "仪表下发CLIENT_INFO"
          check_positive 'func startControlListener' App/CarbitLinkOutput.swift "控制口监听"
          check_positive 'controlListenPort: UInt16 = 10922' App/CarbitLinkOutput.swift "10922端口"
          check_positive 'case carClientInfo(Data)' App/CarbitLinkWire.swift "carClientInfo事件"
          exit $fail

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p

      - name: 还原鉴权证书（可选）
        env:
          IDENTITY_TGZ_B64: ${{ secrets.IDENTITY_TGZ_B64 }}
        run: |
          mkdir -p .local/Identity
          if [ -n "$IDENTITY_TGZ_B64" ]; then
            echo "$IDENTITY_TGZ_B64" | base64 -d > /tmp/identity.tgz
            tar xzf /tmp/identity.tgz -C .local
            ls -l .local/Identity
          else
            echo "未提供 IDENTITY_TGZ_B64，使用空 Identity 目录（可编译，但接收端无法完成配件认证）"
          fi

      - name: 编译（关闭签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project TDSCarKit.xcodeproj \
            -scheme TDSCarKit \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee xcodebuild.log

      - name: 提取编译错误
        if: failure()
        run: |
          echo "===== error 行 ====="
          grep -nE "(^| )error: |fatal error: " xcodebuild.log | head -60 || echo "(没有匹配到 error: 行)"
          echo "===== 失败命令 ====="
          grep -nE "The following build commands failed|BUILD FAILED" -A 8 xcodebuild.log | head -40 || true

      - name: 打包未签名 IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "找到 app: $APP"
          echo "===== Identity 内容（应含 3 个文件，否则配件认证会失败）====="
          ls -l "$APP/Identity" || true
          if [ -z "$(ls -A "$APP/Identity" 2>/dev/null)" ]; then
            echo "::error::Identity 目录为空，CarPlay 配件认证无法完成"
          fi
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry TDSCarKit-unsigned.ipa Payload
          ls -lh TDSCarKit-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TDSCarKit-unsigned-ipa
          path: out/TDSCarKit-unsigned.ipa
          retention-days: 14
