name: probe

on:
  workflow_dispatch:

jobs:
  labels:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15, macos-26, macos-13]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: info
        run: |
          echo "runner=${{ matrix.runner }}"
          sw_vers
          xcodebuild -version || true
